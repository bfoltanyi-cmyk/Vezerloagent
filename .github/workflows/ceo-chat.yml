# Beszélgetés a vezérigazgató agenttel: "ceo" címkés issue-ban vagy annak hozzászólásaiban.
# Csak a repó tulajdonosának üzeneteire fut, így más nem költheti a keretet.
name: Vezérigazgató

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

# Ugyanaz a csoport, mint a munkanapé: munka közben a válasz megvárja a munkanap végét,
# így a kettő nem írja egyszerre a cég állapotát.
concurrency:
  group: alicya-workday
  cancel-in-progress: false

env:
  WORK_BRANCH: alicya/munka

jobs:
  reply:
    if: >-
      contains(github.event.issue.labels.*.name, 'ceo') &&
      github.event.sender.login == github.repository_owner &&
      !github.event.issue.pull_request &&
      (github.event.action != 'labeled' || github.event.label.name == 'ceo')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Munkaág előkészítése
        run: |
          git config user.name "alicya-nexus[bot]"
          git config user.email "alicya-nexus@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$WORK_BRANCH" >/dev/null; then
            git checkout -B "$WORK_BRANCH" "origin/$WORK_BRANCH"
            git merge --no-edit origin/main || git merge --abort
          else
            git checkout -B "$WORK_BRANCH"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Válasz
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ALICYA_CHECKPOINT: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD }}
          CHAT_BUDGET_USD: ${{ vars.CHAT_BUDGET_USD }}
        run: npm run ceo
