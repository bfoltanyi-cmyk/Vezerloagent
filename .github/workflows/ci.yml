name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Az agentek motorfejlesztési ágán kézzel indítható (az Actions által feltöltött ágon magától nem fut).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
