# Az Alicya Nexus munkanapja. Az ütemező óránként ránéz, és a Beállítások fülön megadott
# munkarend szerint indul (alapból hétköznap 8 és 16 órakor, budapesti idő); kézzel is indítható.
# Minden, amit a cég készít (állapot, dokumentumok, kód), az alicya/munka ágra kerül,
# és egy nyitott pull requestben vár arra, hogy beolvaszd a main ágba.
name: Munkanap

on:
  schedule:
    # Nem egész órakor: az óra eleji ütemezések késnek és maradnak ki a leggyakrabban.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

env:
  WORK_BRANCH: alicya/munka

jobs:
  # Gyors ellenőrzés telepítés nélkül: most van-e munkaidő, és nem szünetel-e a cég.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.when.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Munkarend
        id: when
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Kézi indítás." >> "$GITHUB_STEP_SUMMARY"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Ami nincs meg (404: még nincs beállítás vagy munkaág), az az alapérték; más hibánál inkább kimarad a futás,
          # hogy egy szüneteltetett cég ne induljon el egy GitHub-zavar miatt.
          fetch() {
            if gh api "repos/${{ github.repository }}/contents/$1?ref=$WORK_BRANCH" -H "Accept: application/vnd.github.raw" > "$2" 2> err.txt; then return 0; fi
            if grep -q "HTTP 404" err.txt; then echo '{}' > "$2"; return 0; fi
            cat err.txt; return 1
          }
          if ! fetch state/settings.json settings.json; then
            echo "::warning::A beállítások nem olvashatók, ez az ütemezett munkanap kimarad."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          fetch state/company.json company.json || echo '{}' > company.json
          node scripts/schedule.mjs settings.json company.json

  work:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Csak a valódi munkanap áll sorba a levelekkel, döntésekkel és a chattel; az óránkénti kapu nem tolja ki őket.
    concurrency:
      group: alicya-workday
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Munkaág előkészítése
        run: |
          git config user.name "alicya-nexus[bot]"
          git config user.email "alicya-nexus@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$WORK_BRANCH" >/dev/null; then
            git checkout -B "$WORK_BRANCH" "origin/$WORK_BRANCH"
            # A main ágra került változások (a te módosításaid) átkerülnek a munkaágra.
            git merge --no-edit origin/main || { git merge --abort; echo "::warning::A main ág nem olvasztható össze automatikusan a munkaággal; a munkanap a munkaágon folytatódik."; }
          else
            git checkout -B "$WORK_BRANCH"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Munkanap
        id: workday
        env:
          ALICYA_CHECKPOINT: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MODEL_STRATEGIC: ${{ vars.MODEL_STRATEGIC }}
          MODEL_LEAD: ${{ vars.MODEL_LEAD }}
          MODEL_WORKER: ${{ vars.MODEL_WORKER }}
          MODEL_BULK: ${{ vars.MODEL_BULK }}
          MODEL_INBOX: ${{ vars.MODEL_INBOX }}
          MODEL_PRICES: ${{ vars.MODEL_PRICES }}
          PERSONAL_DATA_PROVIDERS: ${{ vars.PERSONAL_DATA_PROVIDERS }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          MOONSHOT_BASE_URL: ${{ vars.MOONSHOT_BASE_URL }}
          INBOX_PASSPHRASE: ${{ secrets.INBOX_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD }}
          RUN_BUDGET_USD: ${{ vars.RUN_BUDGET_USD }}
          MAX_TASKS_PER_RUN: ${{ vars.MAX_TASKS_PER_RUN }}
        run: npm run workday

      - name: Munka mentése a munkaágra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Csak a létező mappák: egy hiányzó (pl. még nincs branding/) miatt a git az egész mentést elutasítaná.
          for d in state docs product branding; do [ -e "$d" ] && git add -A -- "$d"; done
          if git diff --cached --quiet; then
            echo "Nincs változás."
          else
            git commit -m "Munkanap: ${{ steps.workday.outputs.tasks }} feladat, ${{ steps.workday.outputs.usd }} USD"
          fi
          git push origin "$WORK_BRANCH"

          if [ -z "$(gh pr list --head "$WORK_BRANCH" --state open --json number --jq '.[0].number')" ] && [ -n "$(git log origin/main..HEAD --oneline)" ]; then
            gh pr create --head "$WORK_BRANCH" --base main \
              --title "Alicya Nexus: folyamatban lévő munka" \
              --body "Ebben a pull requestben gyűlik az agentek munkája (dokumentumok, kód, állapot). Amikor elégedett vagy vele, olvaszd be; a cég utána ugyanezen az ágon dolgozik tovább." \
              || echo "::warning::Nem sikerült pull requestet nyitni. Engedélyezd: Settings → Actions → General → Allow GitHub Actions to create and approve pull requests."
          fi

      - name: Jóváhagyott kiadások közzététele
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release

      - name: Vezérlőterem összeállítása
        # A vezérlőterem oldala mindig a main legfrissebb változata legyen, akkor is, ha munka közben frissült.
        run: |
          git fetch -q origin main && git checkout origin/main -- dashboard/index.html || true
          npm run build:dashboard

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  dashboard:
    needs: work
    runs-on: ubuntu-latest
    # Ha a GitHub Pages még nincs bekapcsolva, ez a lépés hibát jelez, de a munkanap eredménye már mentve van.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
